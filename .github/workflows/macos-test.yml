name: macOS Install Test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'dev'

jobs:
  macos-test:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install oosh as user
        run: |
          export OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE"
          bash init/oosh

      - name: Run tests as user
        id: user-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          test.suite core 1

      - name: Install oosh as root
        run: |
          sudo -H OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE" bash init/oosh

      - name: Run tests as root
        id: root-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          sudo -H GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_OUTPUT="$GITHUB_OUTPUT" "$BASH_FILE" -l -c '
            test.suite core 1
          '

      - name: Test Summary
        if: always()
        run: |
          userFailed="${{ steps.user-tests.outputs.failed }}"
          rootFailed="${{ steps.root-tests.outputs.failed }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${userFailed:-0}" = "0" ] && [ "${rootFailed:-0}" = "0" ]; then
            echo "### ✅ PASS: macos (root=0, user=0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ FAIL: macos (root=${rootFailed:-?}, user=${userFailed:-?})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
