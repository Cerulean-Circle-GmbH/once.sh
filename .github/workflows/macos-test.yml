name: macOS Install Test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'dev'
      terminal:
        description: 'Open interactive terminal after tests (pass "terminal" to enable)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-test:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Bootstrap oosh on host
        run: |
          export OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE"
          bash init/oosh

      - name: Enable SSH and create test user
        run: |
          sudo systemsetup -setremotelogin on
          sleep 2
          sudo sysadminctl -addUser test -password test -shell /bin/bash
          echo "test ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/test
          # Generate SSH key for runner (ossh config.create needs it)
          ssh-keygen -t ed25519 -f "$HOME/.ssh/id_ed25519" -N "" -q

      - name: Install oosh via ossh
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          oo cmd sshpass
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          export OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE"

          ossh config.create macos "test@localhost"
          ossh config.save.last

          SSHPASS=test sshpass -e ssh \
            -o ControlMaster=yes \
            -o ControlPath="$OSSH_CONTROL_PATH" \
            -o ControlPersist=600 \
            -o StrictHostKeyChecking=accept-new \
            macos true

          ossh key.push macos

          ossh install macos test

          ossh connection.close macos 2>/dev/null
          rm -f "/tmp/ossh-test@localhost" 2>/dev/null
          SSHPASS=test sshpass -e ssh \
            -o ControlMaster=yes \
            -o ControlPath="$OSSH_CONTROL_PATH" \
            -o ControlPersist=600 \
            -o StrictHostKeyChecking=accept-new \
            macos true

      - name: Run tests as user
        id: user-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          ossh exec macos "test.suite core 1"

      - name: Run tests as root
        id: root-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          ossh exec.tty macos "sudo bash -lc 'source /var/root/config/user.env 2>/dev/null; test.suite core 1'"

      - name: Test Summary
        if: always()
        run: |
          userFailed="${{ steps.user-tests.outputs.failed }}"
          rootFailed="${{ steps.root-tests.outputs.failed }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${userFailed:-0}" = "0" ] && [ "${rootFailed:-0}" = "0" ]; then
            echo "### ✅ PASS: macos (root=0, user=0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ FAIL: macos (root=${rootFailed:-?}, user=${userFailed:-?})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Interactive terminal (tmate)
        if: always() && github.event.inputs.terminal == 'terminal'
        uses: mxschmitt/action-tmate@v3.23
        with:
          limit-access-to-actor: true
        timeout-minutes: 30
