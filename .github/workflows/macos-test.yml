name: macOS Install Test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'dev'

jobs:
  macos-test:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install oosh
        run: |
          bash init/oosh

      - name: Run tests as user
        run: |
          export PATH="$HOME/oosh:$PATH"
          source "$HOME/config/user.env" 2>/dev/null || true
          test.suite core 1

      - name: Run tests as root
        run: |
          sudo bash -lc 'source /var/root/config/user.env 2>/dev/null; export PATH=/var/root/oosh:$PATH; test.suite core 1'
