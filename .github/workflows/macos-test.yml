name: macOS Install Test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'dev'
      terminal:
        description: 'Open interactive terminal after tests (pass "terminal" to enable)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  macos-test:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Bootstrap oosh on host
        run: |
          export OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE"
          bash init/oosh

      - name: Enable SSH and create test user
        run: |
          # Generate SSH key and set up oosh SSH directory structure
          # ossh expects: ~/.ssh/private_key/<name>.private_key and ~/.ssh/public_keys/<name>.public_key
          keyName="runner.$(hostname -f)"
          ssh-keygen -t ed25519 -f "$HOME/.ssh/id_ed25519" -N "" -q
          mkdir -p "$HOME/.ssh/private_key" "$HOME/.ssh/public_keys"
          cp "$HOME/.ssh/id_ed25519" "$HOME/.ssh/private_key/${keyName}.private_key"
          cp "$HOME/.ssh/id_ed25519.pub" "$HOME/.ssh/public_keys/${keyName}.public_key"

          # Create test user with proper home directory
          sudo dscl . -create /Users/test
          # Add brew bash to allowed shells and set as test user's shell
          if ! grep -q /opt/homebrew/bin/bash /etc/shells 2>/dev/null; then
            echo /opt/homebrew/bin/bash | sudo tee -a /etc/shells
          fi
          sudo dscl . -create /Users/test UserShell /opt/homebrew/bin/bash
          sudo dscl . -create /Users/test RealName "Test User"
          sudo dscl . -create /Users/test UniqueID 1001
          sudo dscl . -create /Users/test PrimaryGroupID 20
          sudo dscl . -create /Users/test NFSHomeDirectory /Users/test
          sudo dscl . -passwd /Users/test test
          sudo mkdir -p /Users/test
          sudo chown test:staff /Users/test
          echo "test ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/test

          # Allow test user SSH access (macOS restricts to com.apple.access_ssh group)
          sudo dseditgroup -o create -q com.apple.access_ssh 2>/dev/null || true
          sudo dseditgroup -o edit -a test -t user com.apple.access_ssh

          # Deploy runner's public key to test user
          sudo mkdir -p /Users/test/.ssh
          sudo cp "$HOME/.ssh/id_ed25519.pub" /Users/test/.ssh/authorized_keys
          sudo chown -R test:staff /Users/test/.ssh
          sudo chmod 700 /Users/test/.ssh
          sudo chmod 600 /Users/test/.ssh/authorized_keys

          # Enable Remote Login (sshd)
          sudo systemsetup -setremotelogin on
          sleep 2

          # Debug: verify everything
          echo "--- sshd listening ---"
          sudo lsof -i :22 | head -3
          echo "--- test user ---"
          id test
          echo "--- test shell ---"
          dscl . -read /Users/test UserShell
          echo "--- test home ---"
          ls -la /Users/test/
          echo "--- sshd config ---"
          grep -E "^(PubkeyAuth|AuthorizedKeys|AllowUsers|DenyUsers)" /etc/ssh/sshd_config || echo "(no restrictions)"
          echo "--- SSH test (verbose) ---"
          ssh -v -o StrictHostKeyChecking=accept-new -o BatchMode=yes test@localhost true 2>&1 | tail -20 || true

      - name: Install oosh via ossh
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          export OOSH_INSTALL_SOURCE="$GITHUB_WORKSPACE"

          ossh config.create macos "test@localhost"
          ossh config.save.last

          # Key auth — runner's key already in test's authorized_keys
          ssh -o ControlMaster=yes \
            -o ControlPath="$OSSH_CONTROL_PATH" \
            -o ControlPersist=600 \
            -o StrictHostKeyChecking=accept-new \
            macos true

          ossh install macos test

          # Re-deploy runner's key (install may have overwritten authorized_keys)
          sudo cp "$HOME/.ssh/id_ed25519.pub" /Users/test/.ssh/authorized_keys
          sudo chown test:staff /Users/test/.ssh/authorized_keys
          sudo chmod 600 /Users/test/.ssh/authorized_keys

          # Refresh ControlMaster for dev group membership
          ossh connection.close macos 2>/dev/null
          rm -f "/tmp/ossh-test@localhost" 2>/dev/null
          ssh -o ControlMaster=yes \
            -o ControlPath="$OSSH_CONTROL_PATH" \
            -o ControlPersist=600 \
            -o StrictHostKeyChecking=accept-new \
            macos true

      - name: Run tests as user
        id: user-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          ossh exec macos "test.suite core 1"

      - name: Run tests as root
        id: root-tests
        continue-on-error: true
        run: |
          source "$HOME/config/user.env" 2>/dev/null || true
          export OSSH_CONTROL_PATH="/tmp/ossh-%r@%h:%p"
          ossh exec.tty macos "sudo bash -lc 'source /var/root/config/user.env 2>/dev/null; test.suite core 1'"

      - name: Test Summary
        if: always()
        run: |
          userFailed="${{ steps.user-tests.outputs.failed }}"
          rootFailed="${{ steps.root-tests.outputs.failed }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${userFailed:-0}" = "0" ] && [ "${rootFailed:-0}" = "0" ]; then
            echo "### ✅ PASS: macos (root=0, user=0)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ FAIL: macos (root=${rootFailed:-?}, user=${userFailed:-?})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Interactive terminal (tmate)
        if: always() && github.event.inputs.terminal == 'terminal'
        uses: mxschmitt/action-tmate@v3.23
        with:
          limit-access-to-actor: true
        timeout-minutes: 30
