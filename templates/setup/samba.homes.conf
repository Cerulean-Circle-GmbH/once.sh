# oosh setup samba.support: every user sees only the own home folder over SMB
# (decision A, 2026-10-14). Included from smb.conf by one line; a user can log
# in once `setup samba.password <user>` gave them a Samba password.
[homes]
   comment = Home of %S
   browseable = no
   valid users = %S
   read only = no
   create mask = 0700
   directory mask = 0700
